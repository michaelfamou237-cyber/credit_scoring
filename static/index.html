<!DOCTYPE html>

<html lang="fr">

<head>
    <meta charset="UTF-8">
    <title>Scoring Crédit</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>


<body class="min-h-screen bg-slate-950 text-slate-100">

    <header class="border-b border-slate-800">
        <div class="max-w-7xl mx-auto px-6 py-6">
            <h1 class="text-3xl font-bold">Credit Scoring</h1>
            <p class="mt-2 text-slate-400">Système intelligent d'aide à la décision pour l'octroi de crédit</p>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-6 py-8">
        <form id="formCredit" class="grid grid-cols-1 lg:grid-cols-2 gap-6">

            <!-- Informations client -->
            <section class="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl">
                <div class="mb-6">
                    <h2 class="text-xl font-semibold">Informations du client</h2>
                    <p class="text-sm text-slate-400 mt-1">Caractéristiques personnelles et sociales</p>
                </div>
                <div class="space-y-5">
                    <div>
                        <label for="genre" class="block text-sm mb-2">Genre</label>
                        <select id="genre" name="genre" required class="w-full bg-slate-800 border border-slate-700 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-500">
                            <option value="Male">Homme</option>
                            <option value="Female">Femme</option>
                        </select>
                    </div>
                    <div>
                        <label for="marrie" class="block text-sm mb-2">Situation matrimoniale</label>
                        <select id="marrie" name="marrie" required class="w-full bg-slate-800 border border-slate-700 rounded-lg px-4 py-3">
                            <option value="Yes">Oui</option>
                            <option value="No">Non</option>
                        </select>
                    </div>
                    <div>
                        <label for="travailleur_indep" class="block text-sm mb-2">Travailleur indépendant</label>
                        <select id="travailleur_indep" name="travailleur_indep" required class="w-full bg-slate-800 border border-slate-700 rounded-lg px-4 py-3">
                            <option value="Yes">Oui</option>
                            <option value="No">Non</option>
                        </select>
                    </div>
                    <div>
                        <label for="credit_historique" class="block text-sm mb-2">Historique de crédit</label>
                        <select id="credit_historique" name="credit_historique" required class="w-full bg-slate-800 border border-slate-700 rounded-lg px-4 py-3">
                            <option value="oui">Oui</option>
                            <option value="non">Non</option>
                        </select>
                    </div>
                    <div>
                        <label for="zone_residence" class="block text-sm mb-2">Zone de résidence</label>
                        <select id="zone_residence" name="zone_residence" required class="w-full bg-slate-800 border border-slate-700 rounded-lg px-4 py-3">
                            <option value="Urbain">Urbain</option>
                            <option value="SemiUrbain">Semi-urbain</option>
                            <option value="Rural">Rural</option>
                        </select>
                    </div>
                    <div>
                        <label for="Education" class="block text-sm mb-2">Niveau d'éducation</label>
                        <select id="Education" name="Education" required class="w-full bg-slate-800 border border-slate-700 rounded-lg px-4 py-3">
                            <option value="Graduate">Diplômé</option>
                            <option value="Not Graduate">Non diplômé</option>
                        </select>
                    </div>
                </div>
            </section>

            <!-- Informations financières -->
            <section class="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl">
                <div class="mb-6">
                    <h2 class="text-xl font-semibold">Informations financières</h2>
                    <p class="text-sm text-slate-400 mt-1">Données relatives à la demande de crédit</p>
                </div>
                <div class="space-y-5">
                    <div>
                        <label for="revenu_demandeur" class="block text-sm mb-2">Revenu du demandeur</label>
                        <input id="revenu_demandeur" name="revenu_demandeur" type="number" step="any" min="0" required
                               placeholder="Ex : 250000"
                               class="w-full bg-slate-800 border border-slate-700 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-500">
                        <p id="apercu_revenu_demandeur" class="text-sm text-slate-400 mt-1"></p>
                    </div>
                    <div>
                        <label for="revenu_codemmandeur" class="block text-sm mb-2">Revenu du co-demandeur</label>
                        <input id="revenu_codemmandeur" name="revenu_codemmandeur" type="number" step="any" min="0" required
                               placeholder="Ex : 300000"
                               class="w-full bg-slate-800 border border-slate-700 rounded-lg px-4 py-3">
                        <p id="apercu_revenu_codemmandeur" class="text-sm text-slate-400 mt-1"></p>
                    </div>
                    <div>
                        <label for="montant_pret" class="block text-sm mb-2">Montant du prêt</label>
                        <input id="montant_pret" name="montant_pret" type="number" step="any" min="0" required
                               placeholder="Ex : 400000"
                               class="w-full bg-slate-800 border border-slate-700 rounded-lg px-4 py-3">
                        <p id="apercu_montant_pret" class="text-sm text-slate-400 mt-1"></p>
                    </div>
                    <div>
                        <label for="pers_en_charge" class="block text-sm mb-2">Personnes à charge</label>
                        <input id="pers_en_charge" name="pers_en_charge" type="number" min="0" required
                               placeholder="Ex : 3"
                               class="w-full bg-slate-800 border border-slate-700 rounded-lg px-4 py-3">
                    </div>
                    <div>
                        <label for="duree_pret" class="block text-sm mb-2">Durée du prêt (jours)</label>
                        <input id="duree_pret" name="duree_pret" type="number" step="any" min="0" required
                               placeholder="Ex : 360"
                               class="w-full bg-slate-800 border border-slate-700 rounded-lg px-4 py-3">
                    </div>
                </div>
            </section>

            <!-- Bouton -->
            <section class="flex items-center">
                <button type="submit"
                        class="w-full bg-blue-600 hover:bg-blue-500 transition rounded-xl py-5 font-semibold text-lg shadow-lg">
                    Soumettre la demande
                </button>
            </section>

            <!-- Résultat -->
            <section id="resultat" class="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl min-h-[180px] flex items-center justify-center">
                <p class="text-slate-400 text-center">Le résultat de l'analyse apparaîtra ici.</p>
            </section>

        </form>
    </main>

    <script src="/static/js/app.js"></script>
</body>
</html>
